<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luke Magette</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="page">

    <div class="title-block">
      <h1 class="name">Luke Magette</h1>
      <p class="subheading">Selected Live Entertainment Work</p>
    </div>

    <div class="carousel-wrapper">
      <div class="carousel" id="carousel">

        <div class="slide active">
          <div class="slide-img-wrap">
            <img src="photos/photo1.jpg" alt="Photo 1" />
          </div>
          <p class="slide-caption">Caption for photo one</p>
        </div>

        <div class="slide">
          <div class="slide-img-wrap">
            <img src="photos/photo2.jpg" alt="Photo 2" />
          </div>
          <p class="slide-caption">Caption for photo two</p>
        </div>

        <div class="slide">
          <div class="slide-img-wrap">
            <img src="photos/photo3.jpg" alt="Photo 3" />
          </div>
          <p class="slide-caption">Caption for photo three</p>
        </div>

        <div class="slide">
          <div class="slide-img-wrap">
            <img src="photos/photo4.jpg" alt="Photo 4" />
          </div>
          <p class="slide-caption">Caption for photo four</p>
        </div>

        <div class="slide">
          <div class="slide-img-wrap">
            <img src="photos/photo5.jpg" alt="Photo 5" />
          </div>
          <p class="slide-caption">Caption for photo five</p>
        </div>

      </div><!-- /.carousel -->

      <button class="carousel-btn prev" id="prevBtn" aria-label="Previous">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <button class="carousel-btn next" id="nextBtn" aria-label="Next">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M9 18l6-6-6-6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div class="carousel-dots" id="carouselDots"></div>

    </div><!-- /.carousel-wrapper -->

  </main>

  <script src="main.js"></script>
</body>
</html>
